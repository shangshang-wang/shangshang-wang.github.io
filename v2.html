<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shangshang Wang</title>
  <meta name="description" content="Shangshang Wang — slow research (Shangshang), slow attention (Ashton), and slow thinking (Upup)." />
  <link rel="icon" type="image/png" href="assets/avatar.png" />

  <!-- Social preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Shangshang Wang" />
  <meta property="og:description" content="Slow Research, Slow Attention, Slow Thinking." />
  <meta property="og:url" content="https://shangshang-wang.github.io/" />
  <meta property="og:image" content="https://shangshang-wang.github.io/assets/avatar.png" />
  <meta name="twitter:card" content="summary" />

  <!-- Font: Zen Kaku Gothic New — a crisp, modern Japanese gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --paper: #efe7d6;   /* kinari — Japanese raw-silk sand */
      --ink:   #1a1a1a;
      --link:  #55534c;
      --who:   #2a2a28;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Lift the whole stack off the bottom edge: the nav used to sit 32px from
       the floor while ~276px went unused up top. Trimming the flex column from
       the bottom moves main's centred hero up by half the amount and the nav up
       by all of it. Declared here, above the media queries, so the short-viewport
       override below actually wins — same specificity, later rule takes it. */
    body { padding-bottom: clamp(1rem, 15vh, 10rem); }

    /* epigraph, centred just above the three links */
    .corner {
      margin: 0 auto clamp(.8rem, 2.3vw, 1.25rem);
      max-width: min(88vw, 44rem);
      padding: 0 1rem;
      text-align: center;
      font-size: clamp(0.72rem, 2.3vw, 0.85rem);
      letter-spacing: 0.01em;
      line-height: 1.4;
      font-weight: 500;
      color: #6d6a61;
    }
    .corner span { white-space: nowrap; }

    /* Signature under the names — hairline draws out from the centre,
       then the text fades in. Sits in the page's existing entrance
       sequence: emblem .05-.29s -> names .42-.62s -> rule .66s ->
       signature .86s -> nav .78s. */
    .sig {
      margin-top: clamp(1.1rem, 3.4vw, 1.9rem);
      font-size: clamp(0.7rem, 2.1vw, 0.82rem);
      font-weight: 500;
      letter-spacing: .06em;
      line-height: 1.4;
      color: #8a8578;
      position: relative;
      padding-top: clamp(.75rem, 2vw, 1.05rem);
    }
    .sig::before {
      content: ""; position: absolute; top: 0; left: 50%;
      width: clamp(38px, 9vw, 62px); height: 1px; background: #bab2a0;
      transform: translateX(-50%) scaleX(0); transform-origin: center;
      animation: rule .85s cubic-bezier(.2,.7,.3,1) .66s forwards;
    }

    /* Letter-by-letter wave, left to right, once every 5s.
       The weight is faked with text-shadow rather than font-weight:
       a real weight change alters advance widths and shoves the rest
       of the line sideways (measured 1.5px of drift). text-shadow is
       paint-only, so the line never reflows. */
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden;
               clip-path: inset(50%); white-space: nowrap; user-select: none; }
    .sig i {
      font-style: normal;
      animation: wave 5s ease-in-out infinite;
      animation-delay: calc(1.7s + var(--i) * .062s);
    }
    @keyframes wave {
      0%, 9%, 100% { text-shadow: none; }
      4.5%         { text-shadow: .28px 0 0 currentColor, -.28px 0 0 currentColor; }
    }
    @keyframes rule { to { transform: translateX(-50%) scaleX(1); } }


    /* ---------- Hero ---------- */
    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(1.5rem, 5vw, 3rem);
    }

    /* The shape triad — now monochrome, each transforming within its own family */
    .emblem {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 4.2vw, 30px);
      margin-bottom: clamp(1.6rem, 5vw, 2.7rem);
    }
    .shp { width: clamp(28px, 6.4vw, 42px); height: clamp(28px, 6.4vw, 42px); display: block; }

    /* entrance (outer) */
    .ein { display: inline-block; opacity: 0; animation: ein .7s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes ein { from { opacity: 0; transform: translateY(14px) scale(.7); } to { opacity: 1; transform: none; } }

    /* solid shapes — the triangle flips and the square turns (hole cut-outs removed) */
    .spin-c { transform-origin: center; animation: spinC 7s ease-in-out infinite; }
    .spin-t { transform-origin: center; animation: spinT 9s ease-in-out infinite -3s; }
    .spin-s { transform-origin: center; animation: spinS 8s ease-in-out infinite -2s; }

    @keyframes spinC { 0%,100% { transform: rotate(0); } 50% { transform: rotate(180deg); } }
    @keyframes spinT { 0%,100% { transform: rotate(0); } 50% { transform: rotate(180deg); } }
    @keyframes spinS { 0%,100% { transform: rotate(0); } 50% { transform: rotate(45deg); } }

    /* Names */
    .names {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: center;
      gap: clamp(0.35em, 2.2vw, 0.6em);
      line-height: 1.02;
      color: var(--ink);
    }
    .nm-s { font-size: clamp(0.96rem, 3.1vw, 1.73rem); font-weight: 400; letter-spacing: .01em; color: #33312c; }
    .nm-a { font-size: clamp(1.37rem, 4.55vw, 2.46rem);    font-weight: 500; color: #211f1b; }
    .nm-u { font-size: clamp(2.18rem, 8.2vw, 3.82rem);    font-weight: 700; letter-spacing: -.012em; }

    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    /* ---------- Nav ---------- */
    nav {
      padding: clamp(1.25rem, 4vw, 2rem) 1rem;
      padding-bottom: calc(clamp(1.25rem, 4vw, 2rem) + env(safe-area-inset-bottom, 0px));
    }
    .links {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: clamp(0.9rem, 3.5vw, 2.2rem);
    }
    .links a {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: var(--link);
      font-size: clamp(0.75rem, 2.35vw, 0.86rem);
      font-weight: 400;
      letter-spacing: .01em;
      border-bottom: 2px solid transparent;
      padding-bottom: 3px;
      transition: color .22s ease, border-color .22s ease;
    }
    .links a .who { font-weight: 500; color: var(--who); transition: color .22s ease; }

    /* Spacing: the flex `gap` used to serve double duty (mark->text and
       text->name), which made the pre-name gap ~2.6x a word space and
       exaggerated the side-bearing differences between S / A / U.
       Split them, then hand-kern the two capitals. */
    .bul { margin-right: 9px; }
    .links a .who { margin-left: .30em; }
    .links li:nth-child(2) .who { margin-left: .25em; }  /* "A" — open diagonal */
    .links li:nth-child(3) .who { margin-left: .27em; }  /* "U" — open bowl */
    .bul svg { width: 14px; height: 14px; display: block; transform-box: fill-box; transform-origin: center; transition: transform .32s cubic-bezier(.2,.7,.3,1); }

    .links a:hover, .links a:focus-visible { color: var(--ink); border-color: var(--ink); outline: none; }
    .links a:hover .who, .links a:focus-visible .who { color: var(--ink); }
    .l-c:hover .bul svg, .l-c:focus-visible .bul svg { transform: scale(1.22); }   /* circle  */
    .l-t:hover .bul svg, .l-t:focus-visible .bul svg { transform: rotate(180deg); } /* triangle */
    .l-s:hover .bul svg, .l-s:focus-visible .bul svg { transform: rotate(45deg); }  /* square   */

    @media (max-width: 640px) {
      .links { flex-direction: column; gap: 1rem; }
      .links a { justify-content: center; }
    }


    /* Tap target: the visible label is ~20px tall, well under the 24x24 CSS px
       floor in WCAG 2.2 SC 2.5.8. Expand the hit area with a pseudo-element so
       the type, the underline and the layout all stay exactly as they were. */
    .links a { position: relative; }
    .links a::after {
      content: ""; position: absolute; inset: -7px -10px;
    }
    @media (max-width: 640px) {
      .links a::after { inset: -12px -14px; }
    }

    /* Short viewports — a phone in landscape is ~320-430px tall, which the
       full-scale layout overflows. Scale the whole stack down instead of
       letting the page scroll. */
    @media (max-height: 470px) and (orientation: landscape) {
      body    { padding-bottom: .5rem; }
      main    { padding: .6rem 1rem; }
      .emblem { margin-bottom: .7rem; }
      .shp    { width: 22px; height: 22px; }
      .nm-s   { font-size: .95rem; }
      .nm-a   { font-size: 1.3rem; }
      .nm-u   { font-size: 2rem; }
      .sig    { margin-top: .5rem; padding-top: .5rem; }
      .corner { margin-bottom: .5rem; }
      nav     { padding: .55rem 1rem; padding-bottom: calc(.55rem + env(safe-area-inset-bottom, 0px)); }
      .links  { gap: 1.1rem; }
      .links a::after { inset: -7px -10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ein, .rise { opacity: 1 !important; animation: none !important; transform: none !important; }
      .sig::before { animation: none !important; transform: translateX(-50%) scaleX(1) !important; }
      .sig i { animation: none !important; }
      .spin-c, .spin-t, .spin-s { animation: none !important; transform: none !important; }
      .bul svg, .links a, .links a .who { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="emblem" aria-hidden="true">
      <span class="ein" style="animation-delay:.05s">
        <svg class="shp spin-c" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="16" fill="#1a1a1a"/>
        </svg>
      </span>
      <span class="ein" style="animation-delay:.17s">
        <svg class="shp spin-t" viewBox="0 0 40 40">
          <polygon points="20,1.5 36.5,29.5 3.5,29.5" fill="#1a1a1a"/>
        </svg>
      </span>
      <span class="ein" style="animation-delay:.29s">
        <svg class="shp spin-s" viewBox="0 0 40 40">
          <rect x="7" y="7" width="26" height="26" fill="#1a1a1a"/>
        </svg>
      </span>
    </div>

    <h1 class="names">
      <span class="rise nm-s" style="animation-delay:.42s">Shangshang&nbsp;Wang</span>
      <span class="rise nm-a" style="animation-delay:.52s">Ashton</span>
      <span class="rise nm-u" style="animation-delay:.62s">&ldquo;Upup&rdquo;</span>
    </h1>
    <p class="sig rise" style="animation-delay:.86s">
      <span class="sr-only">Born Aries, being INFJ.</span>
      <span aria-hidden="true"><i style="--i:0">B</i><i style="--i:1">o</i><i style="--i:2">r</i><i style="--i:3">n</i> <i style="--i:4">A</i><i style="--i:5">r</i><i style="--i:6">i</i><i style="--i:7">e</i><i style="--i:8">s</i><i style="--i:9">,</i> <i style="--i:10">b</i><i style="--i:11">e</i><i style="--i:12">i</i><i style="--i:13">n</i><i style="--i:14">g</i> <i style="--i:15">I</i><i style="--i:16">N</i><i style="--i:17">F</i><i style="--i:18">J</i><i style="--i:19">.</i></span>
    </p>
  </main>

  <p class="corner rise" style="animation-delay:.74s"><span>Research is attention with timing;</span> <span>thinking is attention with time.</span></p>
  <nav class="rise" style="animation-delay:.78s" aria-label="Three slow ways of living">
    <ul class="links">
      <li><a class="l-c" href="https://shangshangwang.notion.site/academic">
        <span class="bul"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#1a1a1a"/></svg></span>
        Slow Research of <span class="who">Shangshang</span></a></li>
      <li><a class="l-t" href="https://shangshangwang.notion.site/personal-collection">
        <span class="bul"><svg viewBox="0 0 24 24"><polygon points="12,3 21,20 3,20" fill="#1a1a1a"/></svg></span>
        Slow Attention of <span class="who">Ashton</span></a></li>
      <li><a class="l-s" href="https://shangshangwang.notion.site/personal-creation">
        <span class="bul"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" fill="#1a1a1a"/></svg></span>
        Slow Thinking of <span class="who">Upup</span></a></li>
    </ul>
  </nav>
</body>
</html>
